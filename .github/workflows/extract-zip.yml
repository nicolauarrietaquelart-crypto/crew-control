name: Extraer proyecto ZIP
on:
  push:
    branches: [main]
    paths:
      - 'crew-control-cloudflare-starter.zip'
      - '.github/workflows/extract-zip.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Descomprimir el proyecto
        run: |
          set -euo pipefail
          mkdir -p /tmp/crew-control-extract
          unzip -q -o crew-control-cloudflare-starter.zip -d /tmp/crew-control-extract
          test -f /tmp/crew-control-extract/crew-control/package.json
          cp -a /tmp/crew-control-extract/crew-control/. ./
          rm -f crew-control-cloudflare-starter.zip
      - name: Guardar archivos extraídos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract Cloudflare starter project"
            git push
          fi
